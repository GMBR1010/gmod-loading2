<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando — GMBR</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:   #34e57a;   /* verde principal, brilhante */
  --green-2: #0b8f3f;   /* verde profundo             */
  --text:    #eef0f4;
  --dim:     #6d7d74;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: #030705;
  color: var(--text);
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ─── fundo: dois halos que se movem devagar ─── */
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .40;
  pointer-events: none;
}
.glow-a {
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, var(--green), transparent 70%);
  top: -22vw; left: -14vw;
  animation: drift-a 22s ease-in-out infinite;
}
.glow-b {
  width: 55vw; height: 55vw;
  background: radial-gradient(circle, var(--green-2), transparent 70%);
  bottom: -20vw; right: -12vw;
  animation: drift-b 26s ease-in-out infinite;
}
@keyframes drift-a {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(6vw, 5vh) scale(1.12); }
}
@keyframes drift-b {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(-5vw,-6vh) scale(1.15); }
}

/* ─── caixotes flutuando (o "prop" escondido) ─── */
.crates { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.crate {
  position: absolute;
  border: 1.5px solid rgba(255,255,255,.055);
  border-radius: 3px;
  animation: float linear infinite;
}
.crate::after {
  content: '';
  position: absolute; inset: 22%;
  border: 1.5px solid rgba(255,255,255,.045);
  border-radius: 2px;
}
@keyframes float {
  0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-25vh) rotate(300deg); opacity: 0; }
}

/* vinheta por cima de tudo */
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
}

/* ─── conteudo central ─── */
.stage {
  position: relative;
  z-index: 5;
  width: 640px;
  max-width: 92vw;
  text-align: center;
}

.flag { font-size: 26px; margin-bottom: 10px; opacity: .9; }

.wordmark {
  font-family: 'Rajdhani', 'Segoe UI', sans-serif;
  font-size: 92px;
  font-weight: 700;
  letter-spacing: .1em;
  line-height: 1;
  background: linear-gradient(100deg, var(--green) 0%, #c8ffdd 45%, var(--green-2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--green);              /* fallback se o clip falhar */
  filter: drop-shadow(0 0 28px rgba(52,229,122,.34));
  animation: breathe 4.5s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { filter: drop-shadow(0 0 28px rgba(52,229,122,.34)); }
  50%     { filter: drop-shadow(0 0 46px rgba(130,255,180,.46)); }
}

.mode {
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .52em;
  text-transform: uppercase;
  color: var(--dim);
  margin: 6px 0 0 4px;   /* 4px compensa o letter-spacing do ultimo caractere */
}

.rule {
  width: 170px; height: 1px;
  margin: 30px auto;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
}

/* mapa + jogador */
.meta { display: flex; justify-content: center; gap: 46px; margin-bottom: 34px; }
.meta-item { min-width: 0; }
.meta-lbl {
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: #4b5a51; margin-bottom: 6px;
}
.meta-val {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px; font-weight: 600; letter-spacing: .04em;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 260px;
}

/* ─── barra de progresso ─── */
.bar-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 9px;
}
.bar-head span:first-child {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
}
#pct {
  font-family: 'Rajdhani', sans-serif;
  font-size: 19px; font-weight: 700; color: var(--green);
}

.bar {
  height: 5px;
  background: rgba(255,255,255,.07);
  border-radius: 99px;
  overflow: hidden;
}
#fill {
  height: 100%; width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--green-2), var(--green), #b6ffd0);
  box-shadow: 0 0 14px rgba(52,229,122,.55);
  transition: width .35s ease;
  position: relative;
}
/* brilho que corre por cima do preenchimento */
#fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  animation: shimmer 1.8s linear infinite;
}
@keyframes shimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

#status {
  margin-top: 13px;
  height: 15px;
  font-size: 11.5px;
  color: #55645b;
  font-family: 'Inter', monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ─── player de musica (canto inferior direito) ─── */
.player {
  position: fixed;
  bottom: 26px; right: 26px;
  z-index: 10;
  display: flex; align-items: center; gap: 13px;
  padding: 11px 17px;
  background: rgba(4,11,7,.82);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 40px;
}

/* barrinhas de equalizador - so animam tocando */
.eq { display: flex; align-items: flex-end; gap: 2.5px; height: 17px; width: 22px; }
.eq i {
  flex: 1;
  background: var(--green);
  border-radius: 1px;
  height: 20%;
  transition: height .2s;
}
.player.playing .eq i { animation: bounce .9s ease-in-out infinite; }
.player.playing .eq i:nth-child(2) { animation-delay: .18s; }
.player.playing .eq i:nth-child(3) { animation-delay: .36s; }
.player.playing .eq i:nth-child(4) { animation-delay: .54s; }
@keyframes bounce {
  0%,100% { height: 22%; }
  50%     { height: 100%; }
}

#toggle {
  width: 29px; height: 29px;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.09);
  color: var(--text);
  font-size: 11px; line-height: 29px;
  cursor: pointer;
  transition: background .18s, transform .18s;
}
#toggle:hover { background: rgba(52,229,122,.28); transform: scale(1.08); }

#vol {
  -webkit-appearance: none; appearance: none;
  width: 76px; height: 3px;
  border-radius: 99px;
  background: rgba(255,255,255,.14);
  outline: none; cursor: pointer;
}
#vol::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(52,229,122,.75);
}
#vol::-moz-range-thumb {
  width: 11px; height: 11px; border: none;
  border-radius: 50%;
  background: var(--green);
}

/* aviso de autoplay bloqueado */
.nudge {
  position: fixed;
  bottom: 78px; right: 26px;
  z-index: 10;
  font-size: 11px;
  color: var(--green);
  background: rgba(52,229,122,.10);
  border: 1px solid rgba(52,229,122,.28);
  border-radius: 7px;
  padding: 7px 13px;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
}
.nudge.show { opacity: 1; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

@media (max-width: 700px) {
  .wordmark { font-size: 58px; }
  .meta { gap: 26px; }
  .meta-val { font-size: 18px; max-width: 150px; }
}
</style>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>
<div class="crates" id="crates"></div>
<div class="vignette"></div>

<div class="stage">
  <div class="flag">🇧🇷</div>
  <div class="wordmark">GMBR</div>
  <div class="mode">Prop Hunt</div>

  <div class="rule"></div>

  <div class="meta">
    <div class="meta-item">
      <div class="meta-lbl">Mapa</div>
      <div class="meta-val" id="map">—</div>
    </div>
    <div class="meta-item">
      <div class="meta-lbl">Jogador</div>
      <div class="meta-val" id="player">—</div>
    </div>
  </div>

  <div class="bar-head">
    <span>Carregando</span>
    <span id="pct">0%</span>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div id="status">Conectando ao servidor…</div>
</div>

<div class="player" id="player-box">
  <div class="eq"><i></i><i></i><i></i><i></i></div>
  <button id="toggle" title="Tocar / pausar">❚❚</button>
  <input type="range" id="vol" min="0" max="100" value="12">
</div>

<div class="nudge" id="nudge">Clique para ativar a música</div>

<audio id="music" preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ═══════════ caixotes de fundo ═══════════ */
(function () {
  var box = document.getElementById('crates');
  var html = '';
  for (var i = 0; i < 14; i++) {
    var size  = 26 + Math.random() * 60;
    var left  = Math.random() * 100;
    var dur   = 26 + Math.random() * 26;
    var delay = -Math.random() * dur;          // negativo: ja entram espalhados
    html += '<div class="crate" style="width:' + size + 'px;height:' + size + 'px;left:'
         +  left + '%;animation-duration:' + dur + 's;animation-delay:' + delay + 's"></div>';
  }
  box.innerHTML = html;
})();

/* ═══════════ musica ═══════════ */
var audio    = document.getElementById('music');
var box      = document.getElementById('player-box');
var toggle   = document.getElementById('toggle');
var vol      = document.getElementById('vol');
var nudge    = document.getElementById('nudge');
var START_AT = 50;        // a faixa comeca aos 50s
var playing  = false;

audio.volume = vol.value / 100;

// O seek so vale depois que os metadados carregam. Se for feito antes,
// o navegador descarta em silencio e a musica toca do zero.
function seekToStart() {
  try { audio.currentTime = START_AT; } catch (e) {}
}
if (audio.readyState >= 1) seekToStart();
else audio.addEventListener('loadedmetadata', seekToStart, { once: true });

// Sem o atributo loop de proposito: com ele o navegador reinicia do zero
// e o evento 'ended' nunca dispara, entao o retorno aos 50s nunca acontecia.
audio.addEventListener('ended', function () {
  seekToStart();
  audio.play().catch(function () {});
});

function setPlaying(on) {
  playing = on;
  toggle.textContent = on ? '❚❚' : '▶';
  box.classList.toggle('playing', on);
  if (on) nudge.classList.remove('show');
}

function tryPlay() {
  return audio.play().then(function () {
    setPlaying(true);
  }).catch(function () {
    setPlaying(false);
    nudge.classList.add('show');   // autoplay bloqueado: pede um clique
  });
}

toggle.onclick = function (e) {
  e.stopPropagation();
  if (playing) { audio.pause(); setPlaying(false); }
  else tryPlay();
};

vol.oninput = function () {
  audio.volume = this.value / 100;
};

window.addEventListener('load', function () {
  setTimeout(tryPlay, 400);
});

// Qualquer interacao destrava o autoplay bloqueado pela politica do navegador.
['click', 'keydown', 'mousemove'].forEach(function (ev) {
  document.addEventListener(ev, function once() {
    ['click', 'keydown', 'mousemove'].forEach(function (e2) {
      document.removeEventListener(e2, once);
    });
    if (!playing) tryPlay();
  });
});

/* ═══════════ API da tela de carregamento do GMod ═══════════
   O jogo chama estas funcoes globais durante o carregamento.   */

var totalFiles = 0;

function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  if (mapname) document.getElementById('map').textContent = mapname;
}

function SetPlayerName(name) {
  document.getElementById('player').textContent = name || 'Jogador';
}

function SetMap(mapname) {
  document.getElementById('map').textContent = mapname || '—';
}

function SetFilesTotal(total) {
  totalFiles = total;
}

function SetFilesNeeded(needed) {
  if (totalFiles > 0) {
    updateProgress(Math.round(((totalFiles - needed) / totalFiles) * 100));
  }
}

function DownloadingFile(fileName) {
  var name = String(fileName);
  if (name.length > 58) name = '…' + name.slice(-55);
  document.getElementById('status').textContent = 'Baixando  ' + name;
}

function SetStatusChanged(status) {
  document.getElementById('status').textContent = status || '';
}

function updateProgress(percent) {
  percent = Math.max(0, Math.min(100, percent));
  document.getElementById('fill').style.width = percent + '%';
  document.getElementById('pct').textContent  = percent + '%';
}
</script>

</body>
</html>
